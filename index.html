<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Етикетки · Трекер</title>
<style>
  :root{
    --bg:#14171a;
    --surface:#1c2024;
    --surface-2:#242a2f;
    --surface-3:#2c333a;
    --border:#343c43;
    --text:#eceeef;
    --text-muted:#8f9aa3;
    --text-dim:#666f77;
    --amber:#f2a93b;
    --amber-dim:#7a5a1f;
    --red:#e35b3d;
    --green:#38c98a;
    --green-dim:#1c4f3c;
    --radius:10px;
    --mono: ui-monospace, "SFMono-Regular", "Roboto Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  body{-webkit-tap-highlight-color:transparent; padding-bottom:24px;}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;}
 
  .app{max-width:640px;margin:0 auto;min-height:100vh;background:var(--bg);}
 
  /* HEADER */
  header.top{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg,#181c1f 0%, #14171a 100%);
    border-bottom:1px solid var(--border);
    padding:14px 16px 0 16px;
  }
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .brand .lamp{width:10px;height:10px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px 2px rgba(242,169,59,.55);}
  .brand h1{font-size:15px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;margin:0;color:var(--text);}
  .brand span{color:var(--text-dim);font-size:12px;margin-left:auto;font-family:var(--mono);}
 
  .tabs{display:flex;gap:2px;}
  .tab{
    flex:1;text-align:center;padding:10px 4px 12px 4px;border:none;background:transparent;
    color:var(--text-muted);font-size:13px;font-weight:600;letter-spacing:.02em;
    border-bottom:2px solid transparent;cursor:pointer;
  }
  .tab.active{color:var(--amber);border-bottom-color:var(--amber);}
 
  main{padding:14px 14px 40px 14px;}
  section{display:none;}
  section.active{display:block;}
 
  .toolbar{display:flex;gap:8px;margin-bottom:14px;}
  .btn{
    appearance:none;border:1px solid var(--border);background:var(--surface-2);color:var(--text);
    padding:10px 14px;border-radius:8px;font-size:13.5px;font-weight:600;cursor:pointer;
  }
  .btn:active{background:var(--surface-3);}
  .btn-primary{background:var(--amber);color:#1a1400;border-color:var(--amber);flex:1;}
  .btn-primary:active{background:#d6941f;}
  .btn-danger{color:var(--red);border-color:var(--amber-dim);}
  .btn-ghost{background:transparent;}
  .btn-block{width:100%;}
  .btn-sm{padding:6px 10px;font-size:12px;border-radius:6px;}
 
  .empty{
    text-align:center;color:var(--text-dim);padding:50px 20px;font-size:13.5px;line-height:1.6;
    border:1px dashed var(--border);border-radius:var(--radius);
  }
 
  /* ORDER / LABEL ROWS */
  .row{
    display:flex;align-items:center;gap:10px;
    background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--text-dim);
    border-radius:8px;padding:11px 12px;margin-bottom:8px;cursor:pointer;
  }
  .row.matched{border-left-color:var(--green);}
  .row.warn{border-left-color:var(--red);}
  .row:active{background:var(--surface-2);}
  .led{width:9px;height:9px;border-radius:50%;flex:none;background:var(--text-dim);}
  .row.matched .led{background:var(--green);box-shadow:0 0 6px 1px rgba(56,201,138,.65);animation:pulse 2.4s ease-in-out infinite;}
  @media (prefers-reduced-motion: reduce){ .row.matched .led{animation:none;} }
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.45;}}
  .row-main{flex:1;min-width:0;}
  .row-line1{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:13px;color:var(--text);}
  .row-line2{display:flex;justify-content:space-between;gap:8px;margin-top:3px;font-size:11.5px;color:var(--text-muted);}
  .row-line2 .code{font-family:var(--mono);color:var(--amber);font-size:12px;}
  .row-line2 .missing{color:var(--red);}
  .machine-badge{
    font-family:var(--mono);font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;
    background:var(--surface-3);color:var(--text-muted);border:1px solid var(--border);white-space:nowrap;
  }
  .row.matched .machine-badge{color:var(--green);border-color:var(--green-dim);background:rgba(56,201,138,.08);}
 
  .label-row .code-main{font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:.02em;}
  .label-matches{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;}
  .label-matches .machine-badge{color:var(--green);border-color:var(--green-dim);background:rgba(56,201,138,.08);}
 
  .row-actions{display:flex;gap:6px;}
  .icon-btn{
    background:transparent;border:none;color:var(--text-dim);font-size:16px;padding:4px 6px;cursor:pointer;line-height:1;
  }
  .icon-btn:active{color:var(--red);}
 
  /* MODAL */
  .overlay{
    position:fixed;inset:0;background:rgba(6,7,8,.72);display:none;align-items:flex-end;justify-content:center;z-index:100;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;
    border-radius:16px 16px 0 0;border:1px solid var(--border);border-bottom:none;padding:18px 16px 24px 16px;
    animation:slideup .18s ease-out;
  }
  @keyframes slideup{from{transform:translateY(16px);opacity:.6;}to{transform:translateY(0);opacity:1;}}
  .modal h2{font-size:15px;margin:0 0 14px 0;color:var(--text);letter-spacing:.02em;}
  .modal h2 .sub{display:block;font-size:11.5px;color:var(--text-dim);font-weight:400;margin-top:2px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11.5px;color:var(--text-muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em;}
  .field input[type=text],.field input[type=date],.field select,.field textarea{
    width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    padding:10px 11px;border-radius:8px;font-size:14px;
  }
  .field textarea{min-height:110px;resize:vertical;font-family:var(--mono);font-size:12.5px;line-height:1.5;}
  .field select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text-dim) 50%),linear-gradient(135deg,var(--text-dim) 50%,transparent 50%);background-position:calc(100% - 18px) center,calc(100% - 13px) center;background-size:5px 5px,5px 5px;background-repeat:no-repeat;}
  .row2{display:flex;gap:8px;}
  .row2 .field{flex:1;}
 
  .method-grid{display:flex;gap:8px;margin-bottom:14px;}
  .method-btn{
    flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:14px 6px;
    text-align:center;color:var(--text-muted);font-size:12px;font-weight:600;cursor:pointer;
  }
  .method-btn .ic{display:block;font-size:20px;margin-bottom:5px;}
  .method-btn.active{border-color:var(--amber);color:var(--amber);background:rgba(242,169,59,.07);}
 
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .thumb{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--border);}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb .rm{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.65);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:11px;line-height:1;cursor:pointer;}
 
  .divider{display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--text-dim);font-size:11px;text-transform:uppercase;letter-spacing:.06em;}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border);}
 
  .status-line{font-size:12.5px;color:var(--text-muted);margin:6px 0 12px 0;min-height:16px;}
  .status-line.err{color:var(--red);}
  .status-line.ok{color:var(--green);}
 
  .review-card{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;}
  .review-card .rc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .review-card .rc-head span{font-size:11px;color:var(--text-dim);font-family:var(--mono);}
  .code-chip{
    display:inline-block;background:var(--surface-3);border:1px solid var(--border);color:var(--amber);
    font-family:var(--mono);font-size:13px;padding:6px 10px;border-radius:7px;margin:0 6px 6px 0;
  }
  .code-chip .rm{background:none;border:none;color:var(--text-dim);margin-left:6px;cursor:pointer;font-size:12px;}
 
  .modal-actions{display:flex;gap:8px;margin-top:16px;}
 
  .settings-list{margin-top:8px;}
  .machine-chip{
    display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);
    font-family:var(--mono);font-size:12.5px;padding:6px 8px 6px 10px;border-radius:7px;margin:0 6px 6px 0;
  }
  .machine-chip button{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:13px;}
  .machine-wrap{display:flex;flex-wrap:wrap;}
 
  ::-webkit-scrollbar{width:0;height:0;}
</style>
</head>
<body>
<div class="app">
 
  <header class="top">
    <div class="brand">
      <div class="lamp" id="headerLamp"></div>
      <h1>Етикетки · Трекер</h1>
      <span id="clock"></span>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="orders">Заявки</button>
      <button class="tab" data-tab="labels">Етикетки</button>
      <button class="tab" data-tab="settings">Налаштування</button>
    </div>
  </header>
 
  <main>
    <!-- ORDERS -->
    <section id="view-orders" class="active">
      <div class="toolbar">
        <button class="btn btn-primary" id="btnAddOrder">+ Додати заявку</button>
        <button class="btn btn-danger" id="btnClearOrders">Очистити все</button>
      </div>
      <div id="ordersList"></div>
    </section>
 
    <!-- LABELS -->
    <section id="view-labels">
      <div class="toolbar">
        <button class="btn btn-primary" id="btnAddLabels">+ Додати етикетки</button>
        <button class="btn btn-danger" id="btnClearLabels">Очистити все</button>
      </div>
      <div id="labelsList"></div>
    </section>
 
    <!-- SETTINGS -->
    <section id="view-settings">
      <div class="field">
        <label>Додати номер машини</label>
        <div class="row2">
          <input type="text" id="newMachineInput" placeholder="напр. J124W">
          <button class="btn" id="btnAddMachine" style="flex:none;">Додати</button>
        </div>
      </div>
      <div class="field">
        <label>Список машин (<span id="machineCount">0</span>)</label>
        <div class="machine-wrap settings-list" id="machinesList"></div>
      </div>
      <button class="btn btn-danger btn-block" id="btnResetMachines">Скинути список машин до типового</button>
    </section>
  </main>
</div>
 
<!-- ORDER DETAIL / EDIT MODAL -->
<div class="overlay" id="overlayOrderDetail">
  <div class="modal">
    <h2>Заявка<span class="sub" id="odSub"></span></h2>
    <div class="row2">
      <div class="field"><label>Дата</label><input type="date" id="odDate"></div>
      <div class="field"><label>Машина</label><select id="odMachine"></select></div>
    </div>
    <div class="field"><label>Numer zlecenia</label><input type="text" id="odNumer"></div>
    <div class="field"><label>Код етикетки</label><input type="text" id="odLabel"></div>
    <div class="field"><label>Повний текст заявки</label><textarea id="odFullText"></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-danger" id="odDelete">Видалити</button>
      <button class="btn btn-ghost" id="odCancel">Закрити</button>
      <button class="btn btn-primary" id="odSave">Зберегти</button>
    </div>
  </div>
</div>
 
<!-- ADD ORDER MODAL -->
<div class="overlay" id="overlayAddOrder">
  <div class="modal">
    <h2>Додати заявку<span class="sub">Текст або фото заявки з комп'ютера/принтера</span></h2>
 
    <div class="field">
      <label>Вставити текст заявки</label>
      <textarea id="aoText" placeholder="Встав текст заявки(-ок) сюди..."></textarea>
    </div>
 
    <div class="divider">або фото</div>
    <div class="method-grid">
      <label class="method-btn" for="aoGallery"><span class="ic">🖼️</span>З галереї</label>
      <label class="method-btn" for="aoCamera"><span class="ic">📷</span>Зробити фото</label>
    </div>
    <input type="file" id="aoGallery" accept="image/*" multiple style="display:none;">
    <input type="file" id="aoCamera" accept="image/*" capture="environment" style="display:none;">
    <div class="thumbs" id="aoThumbs"></div>
 
    <div class="status-line" id="aoStatus"></div>
 
    <div class="modal-actions">
      <button class="btn btn-ghost" id="aoCancel">Скасувати</button>
      <button class="btn btn-primary" id="aoRecognize">Розпізнати</button>
    </div>
 
    <div id="aoReviewWrap" style="display:none;">
      <div class="divider">Знайдені заявки</div>
      <div id="aoReviewList"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="aoBack">Назад</button>
        <button class="btn btn-primary" id="aoSaveAll">Зберегти всі</button>
      </div>
    </div>
  </div>
</div>
 
<!-- ADD LABELS MODAL -->
<div class="overlay" id="overlayAddLabels">
  <div class="modal">
    <h2>Додати етикетки<span class="sub">Коди з коробок / список кодів</span></h2>
 
    <div class="field">
      <label>Вставити список кодів</label>
      <textarea id="alText" placeholder="напр. (G076533) (G063984) ... або E077433, 073042"></textarea>
    </div>
 
    <div class="divider">або фото</div>
    <div class="method-grid">
      <label class="method-btn" for="alGallery"><span class="ic">🖼️</span>З галереї</label>
      <label class="method-btn" for="alCamera"><span class="ic">📷</span>Зробити фото</label>
    </div>
    <input type="file" id="alGallery" accept="image/*" multiple style="display:none;">
    <input type="file" id="alCamera" accept="image/*" capture="environment" style="display:none;">
    <div class="thumbs" id="alThumbs"></div>
 
    <div class="status-line" id="alStatus"></div>
 
    <div class="modal-actions">
      <button class="btn btn-ghost" id="alCancel">Скасувати</button>
      <button class="btn btn-primary" id="alRecognize">Розпізнати</button>
    </div>
 
    <div id="alReviewWrap" style="display:none;">
      <div class="divider">Знайдені коди</div>
      <div id="alReviewList"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="alBack">Назад</button>
        <button class="btn btn-primary" id="alSaveAll">Зберегти всі</button>
      </div>
    </div>
  </div>
</div>
 
<script>
(function(){
  "use strict";
 
  const DEFAULT_MACHINES = "J119W S104W S101P S103W J118P J117P S107W J115P J122P J116P J120W S111W S108W J121W S99W J126W S110W S105P S114P S112P S97W S96W V93W S109W S100W S98W J124W J123W V91W V95P S126W S63W S106 J130 J127 S128 J129 S125 S113".split(/\s+/);
 
  const LS_ORDERS = "flt_orders_v1";
  const LS_LABELS = "flt_labels_v1";
  const LS_MACHINES = "flt_machines_v1";
 
  const state = {
    orders: JSON.parse(localStorage.getItem(LS_ORDERS) || "[]"),
    labels: JSON.parse(localStorage.getItem(LS_LABELS) || "[]"),
    machines: JSON.parse(localStorage.getItem(LS_MACHINES) || "null") || DEFAULT_MACHINES.slice()
  };
 
  function saveOrders(){ localStorage.setItem(LS_ORDERS, JSON.stringify(state.orders)); }
  function saveLabels(){ localStorage.setItem(LS_LABELS, JSON.stringify(state.labels)); }
  function saveMachines(){ localStorage.setItem(LS_MACHINES, JSON.stringify(state.machines)); }
 
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
 
  function extractDigits(code){
    if(!code) return null;
    const m = String(code).match(/\d{6}/);
    return m ? m[0] : null;
  }
 
  function fmtDate(iso){
    if(!iso) return null;
    const p = iso.split("-");
    if(p.length!==3) return iso;
    return `${p[2]}.${p[1]}.${p[0]}`;
  }
 
  function guessMachine(code){
    if(!code) return null;
    const up = code.toUpperCase();
    const exact = state.machines.find(m => m.toUpperCase() === up);
    if(exact) return exact;
    const starts = state.machines.filter(m => m.toUpperCase().startsWith(up));
    if(starts.length === 1) return starts[0];
    return null;
  }
 
  // ---------- MATCHING ----------
  function recompute(){
    state.labels.forEach(l => { l.matchedMachines = []; });
    state.orders.forEach(o => {
      const d = extractDigits(o.labelCode);
      o.matched = false;
      if(d){
        state.labels.forEach(l => {
          if(l.digits === d){
            o.matched = true;
            if(o.machine && !l.matchedMachines.includes(o.machine)) l.matchedMachines.push(o.machine);
          }
        });
      }
    });
    saveOrders(); saveLabels();
  }
 
  // ---------- PARSERS ----------
  function parseOrdersText(text){
    const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length>0);
    const dateRe = /^(\d{2})\.(\d{2})\.(\d{4})$/;
    const machineRe = /^([A-Za-z])\s*-?\s*(\d{2,4})\s*\+?\s*IML\b/i;
    const blocks = [];
    let current = null;
    let pendingDate = null, pendingMachine = null;
 
    for(const line of lines){
      const dm = line.match(dateRe);
      if(dm){ pendingDate = `${dm[3]}-${dm[2]}-${dm[1]}`; continue; }
      const mm = line.match(machineRe);
      if(mm){ pendingMachine = (mm[1] + mm[2]).toUpperCase(); continue; }
      if(/^Numer\s+zlecenia/i.test(line)){
        if(current) blocks.push(current);
        current = { date: pendingDate, machine: pendingMachine, numerZlecenia:"", labelCode:"", fullTextLines:[] };
        pendingDate = null; pendingMachine = null;
      }
      if(current){
        current.fullTextLines.push(line);
        const nz = line.match(/^Numer\s+zlecenia:\s*(.+)$/i);
        if(nz) current.numerZlecenia = nz[1].trim();
        const lc = line.match(/^Uwagi\s+do\s+zam[oó0]wienia:\s*(.+)$/i);
        if(lc) current.labelCode = lc[1].trim();
      }
    }
    if(current) blocks.push(current);
 
    return blocks.map(b => ({
      date: b.date,
      machine: b.machine || guessMachine(b.machine) || (b.machine ? guessMachine(b.machine) : null),
      numerZlecenia: b.numerZlecenia,
      labelCode: (b.labelCode && b.labelCode !== "-") ? b.labelCode : "",
      fullText: b.fullTextLines.join("\n")
    })).map(b => ({...b, machine: b.machine ? (guessMachine(b.machine) || b.machine) : null}));
  }
 
  function parseLabelCodes(text){
    const matches = text.match(/[A-Za-z#]?\s*\(?\s*\d{6}\s*\)?/g) || [];
    const out = [];
    const seenDigits = new Set();
    for(const m of matches){
      const digitsMatch = m.match(/\d{6}/);
      if(!digitsMatch) continue;
      const digits = digitsMatch[0];
      if(seenDigits.has(digits)) continue;
      seenDigits.add(digits);
      const prefixMatch = m.match(/^[A-Za-z#]/);
      const prefix = prefixMatch ? prefixMatch[0].toUpperCase() : "";
      out.push({ raw: prefix + digits, digits });
    }
    return out;
  }
 
  // ---------- OCR ----------
  function fileToBase64(file){
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result.split(",")[1]);
      r.onerror = () => reject(new Error("read failed"));
      r.readAsDataURL(file);
    });
  }
 
  async function ocrImage(file){
    const base64 = await fileToBase64(file);
    const mediaType = file.type || "image/jpeg";
    const resp = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{
          role: "user",
          content: [
            { type: "image", source: { type: "base64", media_type: mediaType, data: base64 } },
            { type: "text", text: "Transcribe ALL text visible in this image exactly as shown, preserving the original line breaks and order. Keep Polish, Ukrainian and Russian text as-is, do not translate. Do not add commentary, headers, quotes or explanation. Output ONLY the raw transcribed text." }
          ]
        }]
      })
    });
    const data = await resp.json();
    if(data.error) throw new Error(data.error.message || "API error");
    return (data.content || []).map(b => b.text || "").join("\n");
  }
 
  // ---------- RENDER: ORDERS ----------
  const ordersList = document.getElementById("ordersList");
  function renderOrders(){
    const arr = state.orders.slice().sort((a,b) => {
      const da = a.date || "9999-99-99", db = b.date || "9999-99-99";
      return da.localeCompare(db);
    });
    if(arr.length === 0){
      ordersList.innerHTML = `<div class="empty">Немає заявок.<br>Натисніть «Додати заявку», щоб додати текст або фото.</div>`;
      return;
    }
    ordersList.innerHTML = arr.map(o => {
      const missing = !o.date || !o.machine;
      const cls = o.matched ? "matched" : (missing ? "warn" : "");
      return `
        <div class="row ${cls}" data-id="${o.id}" data-kind="order">
          <div class="led"></div>
          <div class="row-main">
            <div class="row-line1">
              <span>${o.date ? fmtDate(o.date) : '<span style="color:var(--red)">дата?</span>'}</span>
              <span class="machine-badge">${o.machine || 'машина?'}</span>
            </div>
            <div class="row-line2">
              <span>${escapeHtml(o.numerZlecenia || "—")}</span>
              <span class="code ${!o.labelCode ? 'missing':''}">${o.labelCode || 'код?'}</span>
            </div>
          </div>
        </div>`;
    }).join("");
  }
 
  // ---------- RENDER: LABELS ----------
  const labelsList = document.getElementById("labelsList");
  function renderLabels(){
    const arr = state.labels.slice().sort((a,b) => a.digits.localeCompare(b.digits));
    if(arr.length === 0){
      labelsList.innerHTML = `<div class="empty">Список етикеток порожній.<br>Натисніть «Додати етикетки».</div>`;
      return;
    }
    labelsList.innerHTML = arr.map(l => {
      const matched = l.matchedMachines && l.matchedMachines.length > 0;
      return `
        <div class="row label-row ${matched ? 'matched':''}" data-id="${l.id}" data-kind="label">
          <div class="led"></div>
          <div class="row-main">
            <div class="code-main">${l.raw}</div>
            ${matched ? `<div class="label-matches">${l.matchedMachines.map(m=>`<span class="machine-badge">${m}</span>`).join("")}</div>` : ''}
          </div>
          <div class="row-actions">
            <button class="icon-btn" data-action="delete-label" data-id="${l.id}">✕</button>
          </div>
        </div>`;
    }).join("");
  }
 
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
 
  function renderAll(){ recompute(); renderOrders(); renderLabels(); renderMachines(); }
 
  // ---------- TABS ----------
  document.querySelectorAll(".tab").forEach(t => {
    t.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
      document.querySelectorAll("main section").forEach(x=>x.classList.remove("active"));
      t.classList.add("active");
      document.getElementById("view-" + t.dataset.tab).classList.add("active");
    });
  });
 
  // ---------- CLOCK ----------
  function tickClock(){
    const d = new Date();
    document.getElementById("clock").textContent = d.toLocaleDateString('uk-UA') + " " + d.toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'});
  }
  tickClock(); setInterval(tickClock, 30000);
 
  // ---------- SETTINGS: MACHINES ----------
  const machinesListEl = document.getElementById("machinesList");
  function renderMachines(){
    document.getElementById("machineCount").textContent = state.machines.length;
    machinesListEl.innerHTML = state.machines.map(m => `
      <span class="machine-chip">${m}<button data-action="rm-machine" data-m="${m}">✕</button></span>
    `).join("");
  }
  document.getElementById("btnAddMachine").addEventListener("click", () => {
    const inp = document.getElementById("newMachineInput");
    const v = inp.value.trim().toUpperCase();
    if(!v) return;
    if(!state.machines.includes(v)) state.machines.push(v);
    saveMachines();
    inp.value = "";
    renderMachines();
  });
  document.getElementById("btnResetMachines").addEventListener("click", () => {
    if(!confirm("Скинути список машин до типового переліку?")) return;
    state.machines = DEFAULT_MACHINES.slice();
    saveMachines();
    renderMachines();
  });
  machinesListEl.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-action=rm-machine]");
    if(!btn) return;
    state.machines = state.machines.filter(m => m !== btn.dataset.m);
    saveMachines();
    renderMachines();
  });
  saveMachines();
 
  // ---------- ORDER DETAIL MODAL ----------
  const overlayOrderDetail = document.getElementById("overlayOrderDetail");
  let editingOrderId = null;
 
  function fillMachineSelect(selectEl, currentVal){
    selectEl.innerHTML = `<option value="">— вибрати —</option>` + state.machines.map(m => `<option value="${m}" ${m===currentVal?'selected':''}>${m}</option>`).join("");
  }
 
  function openOrderDetail(id){
    const o = state.orders.find(x => x.id === id);
    if(!o) return;
    editingOrderId = id;
    document.getElementById("odSub").textContent = o.matched ? " · знайдено на буфері" : " · очікує етикетки";
    document.getElementById("odDate").value = o.date || "";
    fillMachineSelect(document.getElementById("odMachine"), o.machine);
    document.getElementById("odNumer").value = o.numerZlecenia || "";
    document.getElementById("odLabel").value = o.labelCode || "";
    document.getElementById("odFullText").value = o.fullText || "";
    overlayOrderDetail.classList.add("open");
  }
  document.getElementById("odCancel").addEventListener("click", () => overlayOrderDetail.classList.remove("open"));
  document.getElementById("odSave").addEventListener("click", () => {
    const o = state.orders.find(x => x.id === editingOrderId);
    if(!o) return;
    o.date = document.getElementById("odDate").value || null;
    o.machine = document.getElementById("odMachine").value || null;
    o.numerZlecenia = document.getElementById("odNumer").value.trim();
    o.labelCode = document.getElementById("odLabel").value.trim();
    o.fullText = document.getElementById("odFullText").value;
    overlayOrderDetail.classList.remove("open");
    renderAll();
  });
  document.getElementById("odDelete").addEventListener("click", () => {
    if(!confirm("Видалити цю заявку?")) return;
    state.orders = state.orders.filter(x => x.id !== editingOrderId);
    overlayOrderDetail.classList.remove("open");
    renderAll();
  });
 
  ordersList.addEventListener("click", (e) => {
    const row = e.target.closest(".row[data-kind=order]");
    if(row) openOrderDetail(row.dataset.id);
  });
 
  labelsList.addEventListener("click", (e) => {
    const delBtn = e.target.closest("[data-action=delete-label]");
    if(delBtn){
      if(confirm("Видалити цей код етикетки?")){
        state.labels = state.labels.filter(l => l.id !== delBtn.dataset.id);
        renderAll();
      }
      return;
    }
  });
 
  // ---------- CLEAR ALL ----------
  document.getElementById("btnClearOrders").addEventListener("click", () => {
    if(state.orders.length===0) return;
    if(!confirm("Очистити весь список заявок?")) return;
    state.orders = [];
    renderAll();
  });
  document.getElementById("btnClearLabels").addEventListener("click", () => {
    if(state.labels.length===0) return;
    if(!confirm("Очистити весь список етикеток?")) return;
    state.labels = [];
    renderAll();
  });
 
  // ---------- ADD ORDER MODAL ----------
  const overlayAddOrder = document.getElementById("overlayAddOrder");
  const aoThumbs = document.getElementById("aoThumbs");
  const aoStatus = document.getElementById("aoStatus");
  let aoFiles = [];
  let aoReviewData = [];
 
  function resetAddOrderModal(){
    document.getElementById("aoText").value = "";
    aoFiles = [];
    aoThumbs.innerHTML = "";
    aoStatus.textContent = "";
    aoStatus.className = "status-line";
    document.getElementById("aoReviewWrap").style.display = "none";
    document.querySelector("#overlayAddOrder .modal-actions").style.display = "flex";
    document.getElementById("aoText").parentElement.style.display = "block";
    document.querySelector("#overlayAddOrder .divider").style.display = "flex";
    document.querySelector("#overlayAddOrder .method-grid").style.display = "flex";
  }
 
  document.getElementById("btnAddOrder").addEventListener("click", () => {
    resetAddOrderModal();
    overlayAddOrder.classList.add("open");
  });
  document.getElementById("aoCancel").addEventListener("click", () => overlayAddOrder.classList.remove("open"));
 
  function addThumb(container, file, filesArr){
    const url = URL.createObjectURL(file);
    const div = document.createElement("div");
    div.className = "thumb";
    div.innerHTML = `<img src="${url}"><button class="rm">✕</button>`;
    div.querySelector(".rm").addEventListener("click", () => {
      const idx = filesArr.indexOf(file);
      if(idx>-1) filesArr.splice(idx,1);
      div.remove();
    });
    container.appendChild(div);
  }
 
  document.getElementById("aoGallery").addEventListener("change", (e) => {
    Array.from(e.target.files).forEach(f => { aoFiles.push(f); addThumb(aoThumbs, f, aoFiles); });
    e.target.value = "";
  });
  document.getElementById("aoCamera").addEventListener("change", (e) => {
    Array.from(e.target.files).forEach(f => { aoFiles.push(f); addThumb(aoThumbs, f, aoFiles); });
    e.target.value = "";
  });
 
  document.getElementById("aoRecognize").addEventListener("click", async () => {
    const manualText = document.getElementById("aoText").value.trim();
    if(!manualText && aoFiles.length===0){
      aoStatus.textContent = "Додайте текст або хоча б одне фото.";
      aoStatus.className = "status-line err";
      return;
    }
    aoStatus.textContent = "Розпізнавання...";
    aoStatus.className = "status-line";
    let combined = manualText ? manualText + "\n" : "";
    try{
      for(const f of aoFiles){
        const t = await ocrImage(f);
        combined += "\n" + t;
      }
    }catch(err){
      aoStatus.textContent = "Помилка розпізнавання: " + err.message;
      aoStatus.className = "status-line err";
      return;
    }
    const parsed = parseOrdersText(combined);
    if(parsed.length===0){
      aoStatus.textContent = "Заявок не знайдено. Перевірте текст/фото та спробуйте ще раз.";
      aoStatus.className = "status-line err";
      return;
    }
    aoStatus.textContent = `Знайдено заявок: ${parsed.length}`;
    aoStatus.className = "status-line ok";
    aoReviewData = parsed;
    renderAoReview();
  });
 
  function renderAoReview(){
    document.getElementById("aoReviewWrap").style.display = "block";
    document.querySelector("#overlayAddOrder .modal-actions").style.display = "none";
    document.getElementById("aoText").parentElement.style.display = "none";
    document.querySelector("#overlayAddOrder .divider").style.display = "none";
    document.querySelector("#overlayAddOrder .method-grid").style.display = "none";
    aoThumbs.style.display = "none";
 
    const wrap = document.getElementById("aoReviewList");
    wrap.innerHTML = aoReviewData.map((o, i) => `
      <div class="review-card" data-idx="${i}">
        <div class="rc-head"><span>Заявка ${i+1}</span></div>
        <div class="row2">
          <div class="field"><label>Дата</label><input type="date" class="rc-date" value="${o.date || ''}"></div>
          <div class="field"><label>Машина</label><select class="rc-machine"></select></div>
        </div>
        <div class="field"><label>Numer zlecenia</label><input type="text" class="rc-numer" value="${escapeAttr(o.numerZlecenia)}"></div>
        <div class="field"><label>Код етикетки</label><input type="text" class="rc-label" value="${escapeAttr(o.labelCode)}"></div>
      </div>
    `).join("");
    wrap.querySelectorAll(".review-card").forEach((card, i) => {
      fillMachineSelect(card.querySelector(".rc-machine"), aoReviewData[i].machine);
    });
  }
 
  function escapeAttr(s){ return String(s||"").replace(/"/g,"&quot;"); }
 
  document.getElementById("aoBack").addEventListener("click", () => {
    resetAddOrderModal();
  });
 
  document.getElementById("aoSaveAll").addEventListener("click", () => {
    const cards = document.querySelectorAll("#aoReviewList .review-card");
    cards.forEach((card, i) => {
      const base = aoReviewData[i];
      state.orders.push({
        id: uid(),
        date: card.querySelector(".rc-date").value || null,
        machine: card.querySelector(".rc-machine").value || null,
        numerZlecenia: card.querySelector(".rc-numer").value.trim(),
        labelCode: card.querySelector(".rc-label").value.trim(),
        fullText: base.fullText || ""
      });
    });
    saveOrders();
    overlayAddOrder.classList.remove("open");
    renderAll();
  });
 
  // ---------- ADD LABELS MODAL ----------
  const overlayAddLabels = document.getElementById("overlayAddLabels");
  const alThumbs = document.getElementById("alThumbs");
  const alStatus = document.getElementById("alStatus");
  let alFiles = [];
  let alReviewData = [];
 
  function resetAddLabelsModal(){
    document.getElementById("alText").value = "";
    alFiles = [];
    alThumbs.innerHTML = "";
    alThumbs.style.display = "flex";
    alStatus.textContent = "";
    alStatus.className = "status-line";
    document.getElementById("alReviewWrap").style.display = "none";
    document.querySelector("#overlayAddLabels .modal-actions").style.display = "flex";
    document.getElementById("alText").parentElement.style.display = "block";
    document.querySelector("#overlayAddLabels .divider").style.display = "flex";
    document.querySelector("#overlayAddLabels .method-grid").style.display = "flex";
  }
 
  document.getElementById("btnAddLabels").addEventListener("click", () => {
    resetAddLabelsModal();
    overlayAddLabels.classList.add("open");
  });
  document.getElementById("alCancel").addEventListener("click", () => overlayAddLabels.classList.remove("open"));
 
  document.getElementById("alGallery").addEventListener("change", (e) => {
    Array.from(e.target.files).forEach(f => { alFiles.push(f); addThumb(alThumbs, f, alFiles); });
    e.target.value = "";
  });
  document.getElementById("alCamera").addEventListener("change", (e) => {
    Array.from(e.target.files).forEach(f => { alFiles.push(f); addThumb(alThumbs, f, alFiles); });
    e.target.value = "";
  });
 
  document.getElementById("alRecognize").addEventListener("click", async () => {
    const manualText = document.getElementById("alText").value.trim();
    if(!manualText && alFiles.length===0){
      alStatus.textContent = "Додайте текст або хоча б одне фото.";
      alStatus.className = "status-line err";
      return;
    }
    alStatus.textContent = "Розпізнавання...";
    alStatus.className = "status-line";
    let combined = manualText ? manualText + "\n" : "";
    try{
      for(const f of alFiles){
        const t = await ocrImage(f);
        combined += "\n" + t;
      }
    }catch(err){
      alStatus.textContent = "Помилка розпізнавання: " + err.message;
      alStatus.className = "status-line err";
      return;
    }
    const parsed = parseLabelCodes(combined);
    if(parsed.length===0){
      alStatus.textContent = "Кодів не знайдено. Перевірте текст/фото та спробуйте ще раз.";
      alStatus.className = "status-line err";
      return;
    }
    alStatus.textContent = `Знайдено кодів: ${parsed.length}`;
    alStatus.className = "status-line ok";
    alReviewData = parsed;
    renderAlReview();
  });
 
  function renderAlReview(){
    document.getElementById("alReviewWrap").style.display = "block";
    document.querySelector("#overlayAddLabels .modal-actions").style.display = "none";
    document.getElementById("alText").parentElement.style.display = "none";
    document.querySelector("#overlayAddLabels .divider").style.display = "none";
    document.querySelector("#overlayAddLabels .method-grid").style.display = "none";
    alThumbs.style.display = "none";
 
    const wrap = document.getElementById("alReviewList");
    wrap.innerHTML = `<div id="alChips"></div>`;
    const chips = document.getElementById("alChips");
    renderChips();
    function renderChips(){
      chips.innerHTML = alReviewData.map((c,i) => `<span class="code-chip">${c.raw}<button class="rm" data-i="${i}">✕</button></span>`).join("");
      chips.querySelectorAll(".rm").forEach(btn => {
        btn.addEventListener("click", () => {
          alReviewData.splice(Number(btn.dataset.i),1);
          renderChips();
        });
      });
    }
  }
 
  document.getElementById("alBack").addEventListener("click", () => {
    resetAddLabelsModal();
  });
 
  document.getElementById("alSaveAll").addEventListener("click", () => {
    const existingDigits = new Set(state.labels.map(l => l.digits));
    alReviewData.forEach(c => {
      if(existingDigits.has(c.digits)) return;
      state.labels.push({ id: uid(), raw: c.raw, digits: c.digits, matchedMachines: [] });
      existingDigits.add(c.digits);
    });
    saveLabels();
    overlayAddLabels.classList.remove("open");
    renderAll();
  });
 
  // ---------- INIT ----------
  renderAll();
})();
</script>
</body>
</html>
